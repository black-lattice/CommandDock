name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Test gesture recognition and shortcut routing
        run: swift test

  package:
    name: Universal macOS installer
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Intel and Apple Silicon application
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=1.0.1
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          export VERSION
          ./scripts/build.sh
      - name: Upload installation files
        uses: actions/upload-artifact@v4
        with:
          name: CommandDock-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish downloadable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CommandDock-universal
          path: release
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "CommandDock $RELEASE_TAG" --notes "原生 macOS 键盘应用启动器。支持 Intel 和 Apple Silicon，要求 macOS 13 或更新版本。下载 DMG 后将应用拖入 Applications。此版本采用 ad-hoc 签名，未经过 Apple 公证；首次启动请按 README 的安装说明操作。"
